<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HR-Dashboard Geschäftsführung</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand-300:#99dca3;--brand-600:#2f8a3e;--brand-700:#286d34;--gray-50:#f9fafb;--gray-300:#d0d5dd;--gray-500:#667085;--gray-600:#475467;--gray-700:#344054;--gray-900:#101828;--error-600:#d92d20;
  --font:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--gray-50);font-family:var(--font);color:var(--gray-600);padding:16px}
.card{background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1px #eaecf0,0 1px 2px rgba(16,24,40,.05);padding:32px;width:100%;max-width:400px}
h1{font-size:20px;line-height:30px;font-weight:600;color:var(--gray-900);margin:0 0 4px}
p{font-size:14px;line-height:20px;margin:0 0 20px}
label{display:block;font-size:14px;font-weight:500;color:var(--gray-700);margin-bottom:6px}
input[type=password]{width:100%;font-family:var(--font);font-size:16px;color:var(--gray-900);border:0;border-radius:8px;padding:10px 14px;box-shadow:inset 0 0 0 1px var(--gray-300),0 1px 2px rgba(16,24,40,.05)}
input:focus-visible,button:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--brand-300),0 0 0 4px #e2f6e5}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:16px 0 20px;color:var(--gray-700);font-weight:400}
.check input{accent-color:var(--brand-600);width:16px;height:16px;margin:0}
button{width:100%;font-family:var(--font);font-weight:600;font-size:16px;border:0;border-radius:8px;padding:10px 18px;background:var(--brand-600);color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background .12s ease}
button:hover{background:var(--brand-700)}
button[disabled]{background:#f2f4f7;color:#98a2b3;cursor:default}
.err{color:var(--error-600);font-size:14px;margin-top:12px;min-height:20px}
</style>
</head>

  <label for="pw">Passwort</label>
  <input id="pw" type="password" required autofocus>
  <label class="check"><input type="checkbox" id="remember"> Auf diesem Gerät merken</label>
  <button id="go" type="submit">Dashboard öffnen</button>
  <div class="err" id="err" role="alert"></div>
</form>

<script>
"use strict";
const P = JSON.parse(document.getElementById("payload").textContent);
const KEY = "hrdash:" + P.id;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveRaw(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iterations}, base, 256));
}
async function decrypt(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { show(await decrypt(b64(saved))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} } }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const raw = await deriveRaw(document.getElementById("pw").value);
    const html = await decrypt(raw);
    if (document.getElementById("remember").checked) { try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e2) {} }
    show(html);
  } catch (x) {
    err.textContent = "Das Passwort stimmt nicht.";
    btn.disabled = false;
  }
});
</script>
